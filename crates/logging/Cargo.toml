[package]
name = "logging"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
chrono       = { version = "0.4", features = ["serde"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
