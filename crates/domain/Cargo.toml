[package]
name = "domain"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde        = { version = "1", features = ["derive"] }
thiserror    = "2"
uuid         = { version = "1", features = ["v4", "serde"] }
async-trait  = "0.1"
futures-core = "0.3"

[dev-dependencies]
tokio        = { version = "1", features = ["macros", "rt"] }
futures-util = "0.3"
serde_json   = "1"
