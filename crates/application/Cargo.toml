[package]
name = "application"
version = "0.1.0"
edition.workspace = true

[dependencies]
domain       = { path = "../domain" }
async-trait  = "0.1"
tokio        = { version = "1", features = ["full"] }
tokio-util   = { version = "0.7", features = ["rt"] }
tracing      = "0.1"
thiserror    = "2"
futures-core = "0.3"
futures-util = "0.3"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
